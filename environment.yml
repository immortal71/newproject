name: obelisk-hunt
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - sra-tools>=3.1        # prefetch, fasterq-dump
  - spades>=3.15          # provides rnaspades.py
  - megahit>=1.2          # optional faster alternative assembler
  - samtools
  - seqkit
  - pip
  - pip:
      - -r requirements.txt
